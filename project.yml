name: Parrot
options:
  bundleIdPrefix: com.uygar
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  # On-device speaker diarization (CoreML pyannote). Keep the pin in sync
  # with Package.swift.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: 5390df9752c8fc583596018360c5fd70d6fa6c75
  # Vendored SpeexDSP for acoustic echo cancellation (mic + system-audio reference).
  CSpeexDSP:
    path: Vendor/CSpeexDSP
  # Self-updating. Ships nested code (framework, Installer.xpc, Autoupdate,
  # Updater.app) that scripts/release.sh signs inside-out before notarizing.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"

targets:
  Parrot:
    type: application
    platform: macOS
    sources:
      - path: Parrot
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uygar.parrot
        PRODUCT_NAME: Parrot
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Parrot/Info.plist
        CODE_SIGN_ENTITLEMENTS: Parrot/Parrot.entitlements
        CODE_SIGN_STYLE: Automatic
        # Sign with a stable identity instead of ad-hoc. macOS keys Screen
        # Recording / mic permission to the app's signing identity; ad-hoc signing
        # changes the code hash on every build, so the OS forgets the grant and
        # re-prompts each time. A real team keeps the identity constant, so
        # permission granted once persists across rebuilds (and for real users).
        DEVELOPMENT_TEAM: "5D8KQ6NJGF"
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        # App icon lives in Parrot/Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: CSpeexDSP
        product: CSpeexDSP
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Parrot/Parrot.entitlements
      properties:
        # Sandbox + the microphone entitlements. Without audio-input (and, on
        # recent macOS, microphone) a sandboxed app cannot access the mic AT ALL
        # and never appears in Privacy → Microphone. These MUST live here as
        # properties — xcodegen overwrites Parrot.entitlements on every generate,
        # so an external file would be wiped.
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
        # Outbound HTTPS for the Claude copilot API.
        com.apple.security.network.client: true
        # User-picked files (knowledge base imports, audio import) + Downloads.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        # Sparkle's installer XPC service lives outside the sandbox so it can
        # replace the app bundle. Without these two names self-updating fails
        # silently. The downloader service isn't needed — we have network.client.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.uygar.parrot-spks
          - com.uygar.parrot-spki
    info:
      path: Parrot/Info.plist
      properties:
        # REQUIRED for mic access: without this string macOS crashes the app on
        # first mic use and never shows it in Privacy → Microphone. Must live here
        # because xcodegen regenerates Info.plist on every generate.
        NSMicrophoneUsageDescription: "Parrot records your microphone so it can transcribe your side of the meeting on-device."
        # Shown when macOS asks for Screen Recording, which Parrot uses to capture
        # system audio via ScreenCaptureKit. Also lives here so xcodegen keeps it.
        NSScreenCaptureUsageDescription: "Parrot captures system audio from your meetings via screen recording. Only audio is used — never screen content."
        # macOS 15+: shown by the audio-only "System Audio Recording" consent
        # prompt (Core Audio process tap). This replaces the Screen Recording
        # ask on modern macOS; without the key the tap is silently denied.
        NSAudioCaptureUsageDescription: "Parrot records your meeting's audio (what you hear) to transcribe it on-device. It never sees your screen."
        # Points Finder/Dock at the asset-catalog icon (asset compiler doesn't
        # inject this when the Info.plist is static).
        CFBundleIconName: AppIcon
        # Auto-register bundled fonts (Parrot/Fonts/*.otf, flattened into
        # Resources by xcodegen) — the whole UI runs on Inter.
        ATSApplicationFontsPath: "."
        # Sparkle. The feed is served by GitHub Pages from docs/ on master, the
        # same place the help guide lives. SUPublicEDKey is the public half of
        # the EdDSA key in the release machine's login Keychain — updates not
        # signed by it are refused, so a hijacked feed still can't ship code.
        # Installer launcher service is required for sandboxed apps.
        SUFeedURL: "https://turantekin.github.io/Parrot/appcast.xml"
        SUPublicEDKey: "5+CifCVb0y0I1NthwWggSCNDRclBd19qGUx5tC2uGU4="
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
